name: Build and release

on:
    push:
        tags:
            - 'v*.*.*'
            - 'v*.*.*-rc.*'

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install Node dependencies
              run: npm ci

            # Ships the plugin-update-checker runtime into vendor/ so it is
            # present in the packaged zip. Without this the updater silently
            # no-ops on the live site.
            - name: Install PHP dependencies
              run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

            - name: Package plugin
              run: ./node_modules/.bin/wp-scripts plugin-zip

            - name: Release
              uses: softprops/action-gh-release@v2
              with:
                  files: jc-core-functionality.zip
                  generate_release_notes: true
