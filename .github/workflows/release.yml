name: Build and release

on:
    push:
        tags:
            - 'v*.*.*'
            - 'v*.*.*-rc.*'

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install Node dependencies
              run: npm ci

            # Ships the plugin-update-checker runtime into vendor/ so it is
            # present in the packaged zip. Without this the updater silently
            # no-ops on the live site.
            - name: Install PHP dependencies
              run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

            - name: Package plugin
              run: ./node_modules/.bin/wp-scripts plugin-zip

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                  files: jc-core-functionality.zip
                  generate_release_notes: true
                  # RC tags must not become "Latest": plugin-update-checker
                  # reads /releases/latest, which skips only prereleases, so an
                  # unflagged RC is offered to every installed site.
                  prerelease: ${{ contains(github.ref_name, '-rc') }}
